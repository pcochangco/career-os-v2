services:
  - type: web
    name: career-os
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/pcochangco/career-os-v2
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: CAREEROS_APP_VERSION
        value: 0.1.0
      - key: CAREEROS_ENVIRONMENT
        value: production
      - key: CAREEROS_DATABASE_URL
        fromDatabase:
          name: career-os-db
          property: connectionString
      - key: CAREEROS_AI_MODE
        value: live
      - key: CAREEROS_AI_PROVIDER
        value: groq
      - key: CAREEROS_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CAREEROS_AI_MODEL
        value: openai/gpt-oss-120b
      - key: CAREEROS_AI_CRITIC_MODEL
        value: openai/gpt-oss-20b
      - key: CAREEROS_AI_REPAIR_MODEL
        value: qwen/qwen3.8-27b
      - key: CAREEROS_AI_RESPONSE_FORMAT
        value: json_object
      - key: CAREEROS_AI_REASONING_EFFORT
        value: low
      - key: CAREEROS_AI_REQUEST_TIMEOUT_SECONDS
        value: 60
      - key: CAREEROS_AI_MAX_COMPLETION_TOKENS
        value: 5000
      - key: CAREEROS_AI_CRITIC_MAX_COMPLETION_TOKENS
        value: 1600
      - key: CAREEROS_AI_REPAIR_MAX_COMPLETION_TOKENS
        value: 4800
      - key: CAREEROS_AI_MAX_REPAIR_ATTEMPTS
        value: 1
      - key: CAREEROS_AI_QUALITY_THRESHOLD
        value: 80
      - key: CAREEROS_AI_GENERATION_LIMIT_PER_HOUR
        value: 3
      - key: CAREEROS_AI_GLOBAL_GENERATION_LIMIT_PER_HOUR
        value: 12
      - key: CAREEROS_AI_API_KEY
        sync: false

databases:
  - name: career-os-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: careeros
    user: careeros
    ipAllowList: []
