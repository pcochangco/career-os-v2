services:
  - type: web
    name: career-os
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/pcochangco/career-os-v2
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: CAREEROS_APP_VERSION
        value: 0.1.0
      - key: CAREEROS_ENVIRONMENT
        value: production
      - key: CAREEROS_DATABASE_URL
        fromDatabase:
          name: career-os-db
          property: connectionString
      - key: CAREEROS_AI_PROVIDER
        value: fixture
      - key: CAREEROS_AI_MODEL
        value: gpt-5.6-terra
      - key: CAREEROS_AI_REASONING_EFFORT
        value: medium
      - key: CAREEROS_AI_MAX_REPAIR_ATTEMPTS
        value: 1
      - key: CAREEROS_AI_QUALITY_THRESHOLD
        value: 80
      - key: CAREEROS_AI_GENERATION_LIMIT_PER_HOUR
        value: 3

databases:
  - name: career-os-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: careeros
    user: careeros
    ipAllowList: []
