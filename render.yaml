services:
  - type: web
    name: career-os
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/pcochangco/career-os-v2
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    # Reference only: the live service is configured in the Render dashboard, which wins over
    # this file. See docs/LAUNCH_SETUP.md "Environment variables" for every setting and default.
    envVars:
      - key: CAREEROS_APP_VERSION
        value: 0.1.0
      - key: CAREEROS_ENVIRONMENT
        value: production
      # Supabase Postgres via the Session pooler (IPv4). Render cannot reach
      # Supabase's IPv6-only direct connection; do not use the transaction
      # pooler for this long-running container. Set the value in the Render
      # dashboard only.
      - key: CAREEROS_DATABASE_URL
        sync: false
      # auto = live AI with the deterministic roadmap as fallback (what production runs).
      - key: CAREEROS_AI_MODE
        value: auto
      - key: CAREEROS_AI_PROVIDER
        value: groq
      - key: CAREEROS_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CAREEROS_AI_MODEL
        value: openai/gpt-oss-120b
      - key: CAREEROS_AI_CRITIC_MODEL
        value: openai/gpt-oss-20b
      - key: CAREEROS_AI_REPAIR_MODEL
        value: qwen/qwen3.8-27b
      - key: CAREEROS_AI_DISCOVERY_MODEL
        value: qwen/qwen3.6-27b
      - key: CAREEROS_AI_RESPONSE_FORMAT
        value: json_object
      - key: CAREEROS_AI_REASONING_EFFORT
        value: low
      - key: CAREEROS_AI_REQUEST_TIMEOUT_SECONDS
        value: 60
      - key: CAREEROS_AI_MAX_COMPLETION_TOKENS
        value: 5000
      - key: CAREEROS_AI_CRITIC_MAX_COMPLETION_TOKENS
        value: 1600
      - key: CAREEROS_AI_REPAIR_MAX_COMPLETION_TOKENS
        value: 4800
      - key: CAREEROS_AI_DISCOVERY_MAX_COMPLETION_TOKENS
        value: 700
      - key: CAREEROS_AI_GENERATION_STRATEGY
        value: staged
      - key: CAREEROS_AI_EXPAND_MAX_COMPLETION_TOKENS
        value: 2500
      - key: CAREEROS_AI_GENERATION_TIME_BUDGET_SECONDS
        value: 240
      - key: CAREEROS_ROADMAP_SKILL
        value: roadmap-mentor
      - key: CAREEROS_AI_TRANSIENT_RETRY_ATTEMPTS
        value: 1
      - key: CAREEROS_AI_TRANSIENT_RETRY_DELAY_SECONDS
        value: 3
      - key: CAREEROS_AI_MAX_REPAIR_ATTEMPTS
        value: 1
      - key: CAREEROS_AI_QUALITY_THRESHOLD
        value: 80
      - key: CAREEROS_AI_GENERATION_LIMIT_PER_HOUR
        value: 3
      - key: CAREEROS_AI_GLOBAL_GENERATION_LIMIT_PER_HOUR
        value: 12
      - key: CAREEROS_RESOURCE_ALTERNATE_LIMIT_PER_STEP_PER_DAY
        value: 3
      - key: CAREEROS_RESOURCE_ALTERNATE_COOLDOWN_SECONDS
        value: 12
      - key: CAREEROS_AI_API_KEY
        sync: false
      - key: CAREEROS_YOUTUBE_API_KEY
        sync: false
      - key: CAREEROS_BRAVE_SEARCH_API_KEY
        sync: false
      - key: CAREEROS_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: CAREEROS_GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: CAREEROS_GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: CAREEROS_APPLE_CLIENT_IDS
        sync: false
      - key: CAREEROS_MANUAL_PREMIUM_EMAILS
        sync: false
      # Temporary beta email sign-in (not real email verification). Enabled
      # only when both values are set; remove them when beta testing ends.
      - key: CAREEROS_EMAIL_TEST_LOGIN_EMAILS
        sync: false
      - key: CAREEROS_EMAIL_TEST_ACCESS_CODE
        sync: false
      # Email-code sign-in (off until a sending domain exists; see docs/LAUNCH_SETUP.md).
      - key: CAREEROS_EMAIL_CODE_LOGIN_ENABLED
        value: false
      - key: CAREEROS_EMAIL_SENDER
        value: resend
      - key: CAREEROS_EMAIL_FROM
        sync: false
      - key: CAREEROS_RESEND_API_KEY
        sync: false
      - key: CAREEROS_ALLOW_GUEST_ACCESS
        value: false
      - key: CAREEROS_AUTH_ANONYMOUS_LIMIT_PER_15_MINUTES
        value: 120
      - key: CAREEROS_AUTH_IDENTITY_LIMIT_PER_15_MINUTES
        value: 20
      - key: CAREEROS_AUTH_DELETION_LIMIT_PER_15_MINUTES
        value: 5
