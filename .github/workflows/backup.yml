name: Nightly database backup

# Off until both secrets exist (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  Supabase Session pooler URI (the same value as Render's
#                        CAREEROS_DATABASE_URL). Not the transaction pooler: pg_dump needs a
#                        session connection.
#   BACKUP_PASSPHRASE    A long random passphrase. Keep a copy in your password manager:
#                        without it a backup cannot be restored.
# The repository is public, so every dump is encrypted (gpg AES256) before it is stored as a
# workflow artifact. Restore steps: docs/LAUNCH_SETUP.md, "Database backups".

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the backup secrets
        id: configured
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Backups are off: add BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets to turn them on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump and encrypt
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # pg_dump from a recent Postgres image works against older servers too.
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' \
            > careeros.dump
          test -s careeros.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" --output "careeros-$stamp.dump.gpg" careeros.dump
          rm careeros.dump
          ls -lh "careeros-$stamp.dump.gpg"

      - name: Store the encrypted backup
        if: steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: careeros-db-${{ env.STAMP }}
          path: careeros-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
