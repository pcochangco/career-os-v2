name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careeros
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAREEROS_DATABASE_URL: postgresql+psycopg://careeros:careeros_ci@localhost:5432/careeros
      CAREEROS_ENVIRONMENT: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Run backend lint
        working-directory: backend
        run: python -m ruff check .

      - name: Build backend image
        run: docker build --tag careeros-api:ci backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check frontend
        run: pnpm frontend:typecheck

      - name: Export frontend web build
        run: pnpm frontend:export
