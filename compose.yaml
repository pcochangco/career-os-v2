name: careeros

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeros}
      POSTGRES_USER: ${POSTGRES_USER:-careeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careeros_local}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-careeros} -d ${POSTGRES_DB:-careeros}
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      CAREEROS_DATABASE_URL: ${CAREEROS_DATABASE_URL:-postgresql+psycopg://careeros:careeros_local@db:5432/careeros}
      CAREEROS_ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

volumes:
  postgres_data:
